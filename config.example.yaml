# Copy to config.yaml (or run: python -m dartvision setup) and edit.
width: 1280
height: 720
fps: 30
exposure: null          # set a number once the lighting is final
cameras:
  - {name: cam1, index: 0, rotate: 0}
  - {name: cam2, index: 1, rotate: 0}
  - {name: cam3, index: 2, rotate: 0}
  - {name: cam4, index: 3, rotate: 0}
detection:
  diff_threshold: 28
  motion_on: 0.0012
  motion_off: 0.0005
  settle_frames: 6
  min_dart_px: 120
  max_dart_px: 25000
  fuse_tolerance_mm: 12
record_dir: recordings
update:
  repo: davidjhole/dartVision
  check_on_start: true
  auto: true          # play: update from GitHub on start (git installs, skipped if offline or you changed code)
  branch: main
voice:
  enabled: true
  output: auto          # auto | computer | web | both  (auto: phone/TV page if its voice is on, else this computer)
  engine: auto          # auto | say | espeak | sapi | off
  require: true         # "Dave, you require 40"
lights:                 # flash the halo light on a 180 (see dartvision/lights.py)
  type: none            # none | http | command | gpio
  # on_url: http://192.168.1.50/relay/0?turn=on
  # off_url: http://192.168.1.50/relay/0?turn=off
  # pin: 18             # gpio: Pi pin driving the MOSFET (PWM, dimmable)
  # brightness: 1.0
